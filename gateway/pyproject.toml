[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.30",
    "redis>=5.1",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "budgets", "cache", "core", "db", "observability", "routing", "translation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
files = ["app", "budgets", "cache", "core", "db", "observability", "routing", "translation", "tests"]
# asyncpg/redis ship partial types; don't fail the build on their internals.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
