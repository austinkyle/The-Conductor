# fly.toml app configuration file generated for conductor-demo on 2026-07-13T11:36:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'conductor-demo'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  EMBEDDING_MODEL = 'text-embedding-3-small'
  FALLBACK_BACKOFF_BASE_MS = '500'
  GATEWAY_HOST = '0.0.0.0'
  SEMANTIC_SIMILARITY_THRESHOLD = '0.92'
  SEMANTIC_TEMPERATURE_BYPASS = '0.3'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
